plugins {
    id 'com.android.application'
}

android {
    namespace 'com.danryu.travelnihongo'
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId 'com.danryu.travelnihongo'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
